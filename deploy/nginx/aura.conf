server {
    listen 80;
    server_name _;

    # Docker DNS Resolver (Required for dynamic proxying if containers restart)
    resolver 127.0.0.11 valid=30s;

    # -------------------------------------------------------------------------
    # ROUTE: API Root Endpoints (health, docs, openapi.json)
    # -------------------------------------------------------------------------
    location ~ ^/(health|docs|redoc|openapi.json)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect /v1/docs to /docs for convenience
    location = /v1/docs {
        return 301 /docs;
    }

    # -------------------------------------------------------------------------
    # ROUTE: Backend API (FastAPI /v1/ routes)
    # -------------------------------------------------------------------------
    location /v1/ {
        # Proxy to 'api' service on port 8000
        proxy_pass http://api:8000;

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running AI queries
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # ROUTE: Frontend (Static App) - Must be LAST to catch all other routes
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
