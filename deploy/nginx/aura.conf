server {
    listen 80;
    server_name _;

    # Docker DNS Resolver (Required for dynamic proxying if containers restart)
    resolver 127.0.0.11 valid=30s;

    # -------------------------------------------------------------------------
    # ROUTE: Frontend (Static App)
    # -------------------------------------------------------------------------
    location / {
        # Proxy to the 'frontend' service on port 80
        set $upstream_frontend http://frontend:80;
        proxy_pass $upstream_frontend;
        
        # Standard Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # ROUTE: Backend API (FastAPI)
    # -------------------------------------------------------------------------
    location /v1/ {
        # Proxy to the 'api' service on port 8000
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api; 
        # Note: We do NOT append /v1/ here because the location match is passed through
        # But if we used a variable, we must be careful. 
        # Simpler without variable for path handling:
        # proxy_pass http://api:8000;
        # But for resilience with variable:
        rewrite ^/v1/(.*) /v1/$1 break;
        proxy_pass http://api:8000;

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running AI queries
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # ROUTE: API Documentation Shortcuts
    # -------------------------------------------------------------------------
    location /docs {
        return 301 /v1/docs;
    }

    location /redoc {
        return 301 /v1/redoc;
    }
}
