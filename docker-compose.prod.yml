services:
  # -----------------------------------------------------------------------------
  # FRONTEND: Static React App served by Internal Nginx
  # -----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "80"
    healthcheck:
      test: [ "CMD-SHELL", "test -f /usr/share/nginx/html/index.html" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aura-network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # ROUTER: Frontend (HTTP)
      - "traefik.http.routers.aura-frontend.rule=Host(`withaura.cc`) || Host(`localhost`)"
      - "traefik.http.routers.aura-frontend.entrypoints=web"
      # ROUTER: Frontend (HTTPS)
      - "traefik.http.routers.aura-frontend-secure.rule=Host(`withaura.cc`) || Host(`localhost`)"
      - "traefik.http.routers.aura-frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.aura-frontend-secure.tls.certresolver=myresolver"
      # SERVICE
      - "traefik.http.services.aura-frontend.loadbalancer.server.port=80"

  # -----------------------------------------------------------------------------
  # BACKEND API: FastAPI Uvicorn Server
  # -----------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    env_file:
      - ${SECRETS_FILE:-backend/.env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\", timeout=5)'" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aura-network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # ROUTER: API (Higher priority paths)
      # Matches: /v1, /health, /docs, /redoc, /openapi.json
      - "traefik.http.routers.aura-api.rule=(Host(`withaura.cc`) || Host(`localhost`)) && (PathPrefix(`/v1`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || Path(`/health`) || Path(`/openapi.json`))"
      - "traefik.http.routers.aura-api.entrypoints=web"
      # ROUTER: API (HTTPS)
      - "traefik.http.routers.aura-api-secure.rule=(Host(`withaura.cc`) || Host(`localhost`)) && (PathPrefix(`/v1`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || Path(`/health`) || Path(`/openapi.json`))"
      - "traefik.http.routers.aura-api-secure.entrypoints=websecure"
      - "traefik.http.routers.aura-api-secure.tls.certresolver=myresolver"
      # SERVICE
      - "traefik.http.services.aura-api.loadbalancer.server.port=8000"

  # -----------------------------------------------------------------------------
  # WORKER: Celery Background Task Worker
  # -----------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - ${SECRETS_FILE:-backend/.env}
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - aura-network

  # -----------------------------------------------------------------------------
  # DATABASE: PostgreSQL with pgvector
  # -----------------------------------------------------------------------------
  db:
    image: ankane/pgvector:v0.4.1
    restart: always
    expose:
      - "5432"
    # Ports NOT mapped to host for security
    env_file:
      - ${SECRETS_FILE:-backend/.env}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aura-network

  # -----------------------------------------------------------------------------
  # CACHE: Redis
  # -----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aura-network

networks:
  aura-network:
    driver: bridge
  proxy:
    external: true

volumes:
  postgres_data_prod:
