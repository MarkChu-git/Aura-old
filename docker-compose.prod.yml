services:
  # -----------------------------------------------------------------------------
  # FRONTEND: Static React App served by Nginx
  # -----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    # No public ports; traffic comes via Edge Nginx (nginx-proxy)
    # Using 'expose' for documentation, though internal network allows access anyway
    expose:
      - "80"
    healthcheck:
      test: [ "CMD-SHELL", "test -f /usr/share/nginx/html/index.html" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aura-network

  # -----------------------------------------------------------------------------
  # BACKEND API: FastAPI Uvicorn Server
  # -----------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    env_file:
      - ${SECRETS_FILE:-.env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\", timeout=5)'" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aura-network

  # -----------------------------------------------------------------------------
  # WORKER: Celery Background Task Worker
  # -----------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - ${SECRETS_FILE:-.env}
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - aura-network

  # -----------------------------------------------------------------------------
  # DATABASE: PostgreSQL with pgvector
  # -----------------------------------------------------------------------------
  db:
    image: ankane/pgvector:v0.4.1
    restart: always
    expose:
      - "5432"
    # Ports NOT mapped to host for security
    env_file:
      - ${SECRETS_FILE:-.env}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aura-network

  # -----------------------------------------------------------------------------
  # CACHE: Redis
  # -----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aura-network

  # -----------------------------------------------------------------------------
  # EDGE PROXY: Nginx Reverse Proxy (Single Entrypoint)
  # -----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      # - "443:443" # Uncomment when SSL is configured
    volumes:
      - ./deploy/nginx/aura.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - aura-network

networks:
  aura-network:
    driver: bridge

volumes:
  postgres_data_prod:
