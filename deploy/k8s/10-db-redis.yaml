apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: aura-prod
spec:
  selector:
    matchLabels:
      app: postgres
  serviceName: postgres
  replicas: 1
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: ankane/pgvector:v0.4.1
        ports:
        - containerPort: 5432
        envFrom:
        - configMapRef:
            name: aura-config
        - secretRef:
            name: aura-secrets
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        emptyDir: {} # WARNING: DATA LOST ON RESTART. Use PVC for persistent storage.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aura-prod
spec:
  ports:
  - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: aura-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: aura-prod
spec:
  ports:
  - port: 6379
  selector:
    app: redis
