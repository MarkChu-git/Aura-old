name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Install dev dependencies (ruff, mypy, pytest, black, isort) 
        # Assuming they are in requirements.txt or we install them explicitly if not
        pip install ruff mypy pytest black isort types-redis types-requests types-python-jose types-passlib sqlalchemy[mypy]

    - name: Lint with Ruff
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        ruff check . --output-format=github

    - name: Check Formatting with Black
      run: |
        black --check .

    - name: Type Check with Mypy
      run: |
        mypy .

    - name: Run Tests with Pytest
      run: |
        # Setup a dummy environment for testing if needed
        export POSTGRES_USER=postgres
        export POSTGRES_PASSWORD=postgres
        export POSTGRES_DB=test_db
        export POSTGRES_HOST=localhost
        pytest

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build Test
      run: npm run build
