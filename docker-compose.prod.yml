services:
  # Frontend Service (Nginx + React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    # In production, we might map port 80:80. 
    # If using a host-level Nginx for SSL, we map 127.0.0.1:8080:80 to avoid public exposure of HTTP.
    # For this setup, we assume the server's clean entrypoint is this container on port 80.
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/aura.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - aura-network

  # Backend API Service
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # Secure: No ports mapped to host. Only accessible via internal network.
    expose:
      - "8000"
    env_file:
      - ${SECRETS_FILE:-.env}
    networks:
      - aura-network
    depends_on:
      - db
      - redis

  # Celery Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - ${SECRETS_FILE:-.env}
    networks:
      - aura-network
    depends_on:
      - db
      - redis

  # Database (PostgreSQL + pgvector)
  db:
    image: ankane/pgvector:v0.4.1
    restart: always
    # Secure: No ports mapped.
    expose:
      - "5432"
    env_file:
      - ${SECRETS_FILE:-.env}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - aura-network

  # Redis
  redis:
    image: redis:7-alpine
    restart: always
    # Secure: No ports mapped.
    expose:
      - "6379"
    networks:
      - aura-network

networks:
  aura-network:
    driver: bridge

volumes:
  postgres_data_prod:
